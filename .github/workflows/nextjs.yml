# Verify the serverful Next.js app. Production deploys via Vercel (tikiti.fun),
# not GitHub Pages. Do not use actions/configure-pages with
# static_site_generator: next — that injects output: 'export' and breaks
# authenticated API routes such as /api/admin/users.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
