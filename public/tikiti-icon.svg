    <rect x="20.5" y="22.5" width="5" height="5" rx="0.8" fill="#22C55E" stroke="none"/>
    <rect x="36" y="20" width="10" height="10" rx="1.5"/>
    <rect x="38.5" y="22.5" width="5" height="5" rx="0.8" fill="#22C55E" stroke="none"/>
    <rect x="18" y="34" width="10" height="10" rx="1.5"/>
    <rect x="20.5" y="36.5" width="5" height="5" rx="0.8" fill="#22C55E" stroke="none"/>
  </g>
  <!-- Small data modules -->
  <g fill="#22C55E">
    <rect x="32" y="36" width="3" height="3" rx="0.5"/>
    <rect x="37" y="36" width="3" height="3" rx="0.5"/>
    <rect x="42" y="36" width="3" height="3" rx="0.5"/>
