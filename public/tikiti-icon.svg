  <defs>
    <clipPath id="ticket">
      <path d="M8 12c0-2.2 1.8-4 4-4h40c2.2 0 4 1.8 4 4v10c-2.4 0-4.4 2-4.4 4.4S53.8 30.8 56 30.8V44c0 2.2-1.8 4-4 4H12c-2.2 0-4-1.8-4-4V30.8c2.4 0 4.4-2 4.4-4.4S10.4 22 8 22V12z"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#22C55E"/>
  <!-- Ticket body -->
  <path fill="#FFFFFF" d="M14 16h36c1.1 0 2 .9 2 2v8.2c-2.5.4-4.4 2.6-4.4 5.2s1.9 4.8 4.4 5.2V46c0 1.1-.9 2-2 2H14c-1.1 0-2-.9-2-2v-9.4c2.5-.4 4.4-2.6 4.4-5.2S14.5 26.6 12 26.2V18c0-1.1.9-2 2-2z"/>
