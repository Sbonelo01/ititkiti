<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" role="img" aria-label="tikiti. wordmark">
  <title>tikiti. wordmark</title>
  <rect x="0" y="0" width="280" height="72" rx="36" fill="#22C55E"/>
  <!-- Base wordmark -->
  <text x="140" y="47" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" fill="#0A0A0A" letter-spacing="-0.5">tikiti.</text>
  <!-- Double dots on both i's: cover default dots then add pairs
       Approximate i positions for "tikiti." centered in 280x72 -->
  <!-- Left i (3rd letter): around x=118 -->
  <rect x="112" y="22" width="10" height="8" fill="#22C55E"/>
  <circle cx="117" cy="24" r="2.2" fill="#0A0A0A"/>
  <circle cx="117" cy="30" r="2.2" fill="#0A0A0A"/>
  <!-- Right i (5th letter): around x=152 -->
  <rect x="146" y="22" width="10" height="8" fill="#22C55E"/>
  <circle cx="151" cy="24" r="2.2" fill="#0A0A0A"/>
  <circle cx="151" cy="30" r="2.2" fill="#0A0A0A"/>
</svg>
